<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi encuesta</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      color: #20303c;
      background:
        radial-gradient(circle, rgba(255,255,255,0.48) 0 2%, transparent 2.5%),
        radial-gradient(circle at 88% 8%, #d8b461 0%, transparent 12%),
        linear-gradient(135deg, #2e2a2a 0%, #473128 50%, #151515 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 34px 16px;
    }

    .page {
      width: min(920px, 100%);
      background: linear-gradient(180deg, #fffdf6 0%, #fff7ec 100%);
      border-radius: 30px;
      border: 2px solid #312010;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.34), inset 0 0 0 3px rgba(255,255,255,0.85);
      overflow: hidden;
      position: relative;
    }

    .page::before {
      content: "ALERTA";
      position: absolute;
      top: 18px;
      right: 20px;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #7a3820;
      transform: rotate(14deg);
    }

    .topbar {
      padding: 24px 34px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(131, 82, 37, 0.12);
    }

    .brand {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #916241;
      text-transform: uppercase;
    }

    .brand-dot {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-right: 8px;
      color: #a76534;
    }

    .date-label {
      font-size: 12px;
      font-weight: 700;
      color: #9f7a57;
    }

    .content {
      padding: 44px 50px;
    }

    .title {
      text-align: center;
    }

    .title h1 {
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1.04;
      color: #443223;
      letter-spacing: -0.04em;
    }

    .title p {
      margin-top: 14px;
      color: #83624a;
      font-size: 14px;
    }

    .question-area {
      margin-top: 40px;
      padding: 34px 26px;
      background: repeating-linear-gradient(45deg, #fffdf9, #fffdf9 2px, #f8eadb 2px, #f8eadb 4px);
      border-radius: 24px;
      border: 1px solid #e8dcc9;
      text-align: center;
    }

    .question {
      font-size: clamp(1.5rem, 3vw, 2rem);
      line-height: 1.2;
      color: #453425;
      font-weight: 800;
      margin-bottom: 22px;
    }

    .rating-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .clear-area {
      display: flex;
      justify-content: center;
      margin-top: 14px;
    }

    .clear-button {
      border: 1px solid #b68a55;
      border-radius: 999px;
      padding: 9px 20px;
      background: #efe8dc;
      color: #5c4228;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 180ms ease;
    }

    .clear-button:hover,
    .clear-button:focus {
      background: #6b5131;
      color: white;
    }

    .rating-button {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1px solid #b68a55;
      background: #fff;
      color: #5d4630;
      font-weight: 800;
      cursor: pointer;
      transition: all 180ms ease;
    }

    .rating-button:hover,
    .rating-button:focus,
    .rating-button.selected {
      background: #6b5131;
      color: white;
      transform: translateY(-2px) scale(1.05);
      box-shadow: 0 12px 26px rgba(94, 58, 19, 0.18);
    }

    .result-panel {
      display: none;
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid #efe0d2;
    }

    .result-panel.visible {
      display: block;
    }

    .result-label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #956d41;
      text-transform: uppercase;
    }

    .result-number {
      display: inline-block;
      margin-top: 10px;
      font-size: 52px;
      font-weight: 900;
      color: #604126;
      line-height: 1;
    }

    .answer-text {
      margin-top: 14px;
      font-size: 15px;
      color: #634a34;
      font-weight: 700;
    }

    .signature {
      margin-top: 28px;
      text-align: center;
      font-size: 12px;
      letter-spacing: 2px;
      color: #9b7b51;
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand"><span class="brand-dot">♥</span>Mushasha bella</div>
      <div class="date-label">Encuesta</div>
    </header>

    <main class="content">
      <section class="title">
        <h1>Resultado oficial</h1>
        <p>mira bien</p>
      </section>

      <section class="question-area">
        <p class="question">Del 1 al 10, ¿cuánto crees que Anthony es guapo?</p>

        <div class="rating-row" aria-label="Selecciona un número">
          <button class="rating-button" type="button">1</button>
          <button class="rating-button" type="button">2</button>
          <button class="rating-button" type="button">3</button>
          <button class="rating-button" type="button">4</button>
          <button class="rating-button" type="button">5</button>
          <button class="rating-button" type="button">6</button>
          <button class="rating-button" type="button">7</button>
          <button class="rating-button" type="button">8</button>
          <button class="rating-button" type="button">9</button>
          <button class="rating-button" type="button">10</button>
        </div>

        <div class="clear-area">
          <button class="clear-button" id="clearButton" type="button">Borrar selección</button>
        </div>

        <section class="result-panel" id="resultPanel">
          <div class="result-label">Tu elección fue</div>
          <div class="result-number" id="selectedNumber">10</div>
          <div class="answer-text" id="selectedText">Felicidades, Mushasha bella. Elegiste el 10. Anthony es muy guapo.</div>
        </section>
      </section>

      <div class="signature">♥</div>
    </main>
  </div>

  <script>
    const buttons = document.querySelectorAll('.rating-button');
    const selectedNumber = document.getElementById('selectedNumber');
    const selectedText = document.getElementById('selectedText');
    const resultPanel = document.getElementById('resultPanel');
    const clearButton = document.getElementById('clearButton');

    buttons.forEach((button) => {
      button.addEventListener('click', () => {
        buttons.forEach((item) => item.classList.toggle('selected', item === button));
        resultPanel.classList.add('visible');
        selectedNumber.textContent = '10';
        selectedText.textContent = 'Felicidades, María Ángel. Elegiste el 10. Anthony es muy guapo.';
      });
    });

    clearButton.addEventListener('click', () => {
      buttons.forEach((item) => item.classList.remove('selected'));
      resultPanel.classList.remove('visible');
      selectedNumber.textContent = '';
      selectedText.textContent = '';
    });
  </script>
</body>
</html>
